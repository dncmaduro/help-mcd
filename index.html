<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Danh sách project nội bộ của MCD." />
    <title>MCD Projects</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Projects</h1>
        <p>Danh sách các hệ thống nội bộ.</p>
      </section>

      <section class="project-grid" aria-label="Danh sách project">
        <a
          class="project-card project-card--purple"
          href="https://mycandycal.vercel.app"
          target="_blank"
          rel="noopener noreferrer"
        >
          <h2>CandyCal</h2>
          <p>Quản lý kho, đơn hàng, doanh số, livestream và thu nhập.</p>
        </a>

        <a
          class="project-card project-card--green"
          href="https://dntt-mcd.vercel.app"
          target="_blank"
          rel="noopener noreferrer"
        >
          <h2>DNTT</h2>
          <p>Tạo, duyệt và theo dõi đề nghị thanh toán.</p>
        </a>

        <a
          class="project-card project-card--blue"
          href="https://tcm-mcd.vercel.app"
          target="_blank"
          rel="noopener noreferrer"
        >
          <h2>TCM</h2>
          <p>Quản lý chấm công, đề xuất thời gian, phòng ban và báo cáo.</p>
        </a>

        <a
          class="project-card project-card--brown"
          href="https://docshub.space"
          target="_blank"
          rel="noopener noreferrer"
        >
          <h2>DocsHub</h2>
          <p>Lưu trữ, chỉnh sửa, chia sẻ và tìm kiếm tài liệu.</p>
        </a>
      </section>
    </main>
  </body>
</html>
